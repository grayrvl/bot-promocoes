name: Checar Promocoes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - name: Rodar bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot.py

      - name: Salvar historico
        run: |
          git config user.name "Bot Promocoes"
          git config user.email "bot@://github.com"
          git add enviados.json
          git commit -m "Atualiza historico" || exit 0
          git push
